spring.application.name=stagemanagement
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/suivi_stagiaire
spring.datasource.username=postgres
spring.datasource.password=ando
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE
# ============================================

# La base est créée et maintenue par Conception2.sql.
# Hibernate vérifie seulement la correspondance avec les entités.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false

# ============================================
# ENCODAGE / JSON
# ============================================

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.jackson.serialization.write-dates-as-timestamps=false

# ============================================
# UPLOAD DE FICHIERS
# ============================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=uploads

# ============================================
# LOGS
# ============================================

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Décommenter seulement pour afficher les paramètres SQL
# logging.level.org.hibernate.orm.jdbc.bind=TRACE