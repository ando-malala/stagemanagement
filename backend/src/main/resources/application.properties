spring.config.import=optional:file:./.env.local[.properties],optional:file:./backend/.env.local[.properties]
spring.application.name=stagemanagement
server.port=8080

spring.datasource.url=${MEF_DB_URL:jdbc:postgresql://localhost:5432/suivi_stagiaire}
spring.datasource.username=${MEF_DB_USER}
spring.datasource.password=${MEF_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

app.upload.dir=${MEF_UPLOAD_DIR:uploads}